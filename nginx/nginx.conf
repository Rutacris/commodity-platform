# ─────────────────────────────────────────────────────────────────────────────
# Nginx — Rwanda Commodity Platform
# Reverse proxy → FastAPI backend with self-signed SSL
# ─────────────────────────────────────────────────────────────────────────────

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    # ── Rate limiting zones ───────────────────────────────────────────────────
    limit_req_zone $binary_remote_addr zone=api:10m      rate=30r/m;
    limit_req_zone $binary_remote_addr zone=insights:10m rate=6r/m;

    # ── Logging ───────────────────────────────────────────────────────────────
    access_log /var/log/nginx/access.log;
    error_log  /var/log/nginx/error.log;

    sendfile on;
    keepalive_timeout 65;

    server {
        listen 80;
        server_name _;

        # Redirect all HTTP → HTTPS
        return 301 https://$host$request_uri;
    }

    server {
        listen 443 ssl;
        server_name _;

        # ── SSL ───────────────────────────────────────────────────────────────
        ssl_certificate     /etc/nginx/ssl/self-signed.crt;
        ssl_certificate_key /etc/nginx/ssl/self-signed.key;

        ssl_protocols       TLSv1.2 TLSv1.3;
        ssl_ciphers         HIGH:!aNULL:!MD5;
        ssl_session_cache   shared:SSL:10m;
        ssl_session_timeout 10m;

        # ── Security headers ──────────────────────────────────────────────────
        add_header X-Frame-Options           DENY;
        add_header X-Content-Type-Options    nosniff;
        add_header X-XSS-Protection          "1; mode=block";
        add_header Referrer-Policy           "no-referrer";
        add_header Strict-Transport-Security "max-age=31536000" always;

        # ── Gzip ──────────────────────────────────────────────────────────────
        gzip on;
        gzip_types application/json text/plain;
        gzip_min_length 1024;

        # ── API proxy ─────────────────────────────────────────────────────────
        location / {
            limit_req zone=api burst=10 nodelay;

            proxy_pass         http://backend:8000;
            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;

            proxy_connect_timeout 10s;
            proxy_read_timeout    60s;
        }

        # ── AI insights — tighter rate limit (CPU-heavy on Mistral) ──────────
        location /insights {
            limit_req zone=insights burst=3 nodelay;

            proxy_pass         http://backend:8000;
            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;

            proxy_read_timeout 180s;   # Mistral on CPU can take ~2min
        }

        # ── Health check — no rate limiting ───────────────────────────────────
        location /health {
            proxy_pass http://backend:8000/health;
            access_log off;
        }
    }
}